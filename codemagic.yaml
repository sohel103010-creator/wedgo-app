# WedGo — Codemagic cloud build (no PC / no Flutter install needed)
#
# How to use:
#   1. Push this folder to a GitHub repo (e.g. sohel103010-creator/wedgo-app).
#      Codemagic no longer accepts zip uploads — it builds from a Git repo only.
#   2. codemagic.io -> Applications -> Add application -> GitHub -> pick the repo.
#   3. Start a build with workflow "wedgo-android-debug".
#   4. When finished, download  app-debug.apk  from build artifacts and
#      install it on the phone (allow "Install unknown apps").
#   5. Supabase keys are baked into the build from ENCRYPTED Codemagic
#      environment variables (SUPABASE_URL / SUPABASE_ANON_KEY, set in the
#      Codemagic dashboard, never in this repo). First launch goes straight
#      to login/register — no Setup screen. If the build ever lacks them,
#      the app falls back to the in-app Setup screen (paste on the phone).
#
# What this builds: a DEBUG-signed APK. Debug signing is automatic, no
# keystore needed, and it installs fine for personal testing. For Play
# Store later, build an AAB signed with the release keystore instead.

workflows:
  wedgo-android-debug:
    name: WedGo Android APK (debug)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - supabase
    scripts:
      - name: Prepare Android build assets
        script: |
          chmod +x android/gradlew
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar
          python3 tools/gen_icon.py
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build debug APK (no keystore needed)
        script: |
          flutter build apk --debug --dart-define SUPABASE_URL=$SUPABASE_URL --dart-define SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
